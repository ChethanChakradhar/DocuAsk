name: Build and Deploy to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create site
        run: |
          mkdir -p docs
          cat > docs/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>DocuAsk - RAG System</title>
            <style>
              body { font-family: Arial; text-align: center; padding: 50px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
              .container { background: white; color: #333; padding: 40px; border-radius: 10px; max-width: 600px; margin: 0 auto; }
              h1 { color: #667eea; }
              a { color: #667eea; text-decoration: none; padding: 10px 20px; border: 2px solid #667eea; border-radius: 5px; display: inline-block; margin: 10px; }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>📄 DocuAsk</h1>
              <p>AI-Powered RAG System for PDFs</p>
              <p><a href="https://railway.app">Deploy on Railway</a></p>
              <p><a href="https://render.com">Deploy on Render</a></p>
              <p><a href="https://github.com/ChethanChakradhar/DocuAsk">View on GitHub</a></p>
            </div>
          </body>
          </html>
          EOF
      
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v3
